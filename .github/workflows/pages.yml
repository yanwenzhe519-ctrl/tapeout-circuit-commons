name: Deploy web demo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Snapshot TapeOut public processors
        run: |
          mkdir -p public/data
          curl --fail --retry 3 --silent --show-error \
            "https://tapeout.work/api/v1/processors?page=1&page_size=8&sort=circuits" \
            --output public/data/tapeout-processors.json
      - name: Require production contract configuration
        env:
          VITE_REGISTRY_ADDRESS: ${{ secrets.VITE_REGISTRY_ADDRESS }}
          VITE_ROUTER_ADDRESS: ${{ secrets.VITE_ROUTER_ADDRESS }}
          VITE_FACTORY_ADDRESS: ${{ secrets.VITE_FACTORY_ADDRESS }}
          VITE_PROCESSOR_RECIPIENT_ADDRESS: ${{ secrets.VITE_PROCESSOR_RECIPIENT_ADDRESS }}
        run: |
          test -n "$VITE_REGISTRY_ADDRESS"
          test -n "$VITE_ROUTER_ADDRESS"
          test -n "$VITE_FACTORY_ADDRESS"
          test -n "$VITE_PROCESSOR_RECIPIENT_ADDRESS"
      - name: Build with production configuration
        env:
          VITE_XLAYER_RPC_URL: ${{ secrets.VITE_XLAYER_RPC_URL }}
          VITE_REGISTRY_ADDRESS: ${{ secrets.VITE_REGISTRY_ADDRESS }}
          VITE_ROUTER_ADDRESS: ${{ secrets.VITE_ROUTER_ADDRESS }}
          VITE_FACTORY_ADDRESS: ${{ secrets.VITE_FACTORY_ADDRESS }}
          VITE_PROCESSOR_RECIPIENT_ADDRESS: ${{ secrets.VITE_PROCESSOR_RECIPIENT_ADDRESS }}
          VITE_POD_ACCOUNT_ADDRESS: ${{ secrets.VITE_POD_ACCOUNT_ADDRESS }}
          VITE_TAPEOUT_PROCESSOR_ADDRESS: ${{ secrets.VITE_TAPEOUT_PROCESSOR_ADDRESS }}
          VITE_TAPEOUT_OWNERSHIP_ADAPTER_ADDRESS: ${{ secrets.VITE_TAPEOUT_OWNERSHIP_ADAPTER_ADDRESS }}
          VITE_TAPEOUT_CONTAINER_ADAPTER_ADDRESS: ${{ secrets.VITE_TAPEOUT_CONTAINER_ADAPTER_ADDRESS }}
          VITE_TAPEOUT_CONTAINER_ADDRESS: ${{ secrets.VITE_TAPEOUT_CONTAINER_ADDRESS }}
          VITE_CIRCUIT_ID: ${{ secrets.VITE_CIRCUIT_ID }}
          VITE_ENABLE_LIVE_CALLS: ${{ secrets.VITE_ENABLE_LIVE_CALLS }}
          VITE_MANIFEST_FALLBACK_URI: ${{ secrets.VITE_MANIFEST_FALLBACK_URI || 'https://yanwenzhe519-ctrl.github.io/tapeout-circuit-commons/manifests/circuit-1-v1.0.1.json' }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
